services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://roastmycode:roastmycode@db:5432/roastmycode
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: roastmycode
      POSTGRES_PASSWORD: roastmycode
      POSTGRES_DB: roastmycode
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roastmycode"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
